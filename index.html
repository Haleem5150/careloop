:root{
  --frame:#F3ECDD; --frame-ink:#141414; --frame-mute:#6B6458;
  --card:#FFFDF8; --ink:#141414; --mute:#6B6458; --line:#ECE4D4;
  --blue:#4E6725; --on-blue:#FFFFFF; --blue-bg:#E2EACB;
  --indigo:#141414; --on-indigo:#FFFFFF;
  --alert:#C23B32; --alert-bg:#FBE9E6; --alert-ink:#8E2A22;
  --pill:#E6DDCA; --tint:#F4EEE2; --idbar:#FFFDF8;
  --yellow:#F4D35E; --pink:#F5B8D7; --green:#A4B66F; --peri:#B5C9EE; --on-pastel:#141414;
  --orange:#E65A12; --barc:#BCB2A0; --tip-bg:#141414; --tip-ink:#FFFFFF;
  --shade:rgba(20,18,12,.5);
  --display:"Space Grotesk",system-ui,sans-serif; --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;

/* Always light, like the reference, whatever the device or viewer theme */
:root,:root[data-theme]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--frame);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;width:1em;height:1em;overflow:hidden;white-space:nowrap;vertical-align:-5px;font-feature-settings:"liga"}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;color:var(--frame-ink)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:36px;height:36px;border-radius:50%;border:2px solid var(--frame-ink);display:grid;place-items:center}
.brand h1{font-size:22px}
.brand small{display:block;font-size:12px;color:var(--frame-mute);font-family:var(--body)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:12px;color:var(--frame-mute);margin-right:2px}
.chip{border:none;border-radius:999px;padding:6px 13px;font-size:13px;background:var(--pill);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--indigo);color:var(--on-indigo)}
.chip.sm{padding:4px 10px;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:none;background:transparent;color:var(--frame-ink);border-radius:999px;padding:7px 14px;font-size:13px;display:flex;align-items:center;gap:6px}
.tab.on{background:var(--indigo);color:var(--on-indigo)}
.idbar{background:var(--idbar);color:var(--ink);border-radius:14px;padding:9px 14px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.idbar.flag{background:var(--alert);color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.75fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border-radius:20px;padding:16px 18px;min-width:0}
.card h2{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h2 .sub{margin-left:auto;font-family:var(--body);font-weight:400;font-size:12px;color:var(--mute)}
.mute{color:var(--mute)}.small{font-size:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv>span:first-child{color:var(--mute);flex-shrink:0}
.kv>span:last-child{text-align:right}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;background:var(--tint);color:var(--ink)}
.tag.sev{background:var(--alert);color:#fff}
.tag.mod{background:var(--alert-bg);color:var(--alert-ink)}
.tag.ok{background:var(--blue-bg);color:var(--blue)}
.progs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.prog{background:var(--tint);border-radius:14px;padding:12px 14px;font-size:13px}.prog .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.prog .ph b{font-weight:500;font-size:14px}.prog .ph .tag{white-space:nowrap;background:var(--card)}.prog .ph .tag.ok{background:var(--blue-bg)}.prog .pr{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;margin-top:3px}
.tag.pr{background:var(--alert-bg);color:var(--alert-ink)}
.tag.file{background:var(--blue);color:var(--on-blue);border:none}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:10px 0 4px}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--pink);border:2px solid var(--ink);color:var(--on-pastel);display:grid;place-items:center;flex-shrink:0}
.avatar .ms{font-size:28px;vertical-align:0}
.who b{font-family:var(--display);font-size:18px;font-weight:600;display:block}
.banner{border-radius:20px;padding:14px 18px;display:flex;gap:12px;align-items:center;background:var(--alert);color:#fff}
.banner.calm{background:var(--peri);color:var(--on-pastel)}
.banner b{font-family:var(--display);font-weight:600;font-size:15px}
.banner .small{opacity:1;color:#fff}
.banner.calm .small{color:var(--on-pastel)}
.banner .btn{background:#fff;color:var(--alert);border:none}
.banner.calm .btn{background:#141414;color:#fff}
.btn{border:none;border-radius:999px;padding:8px 15px;font-size:13px;background:var(--indigo);color:var(--on-indigo);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.ghost{background:var(--tint);color:var(--ink)}
.btn.warn{background:var(--alert);color:#fff}
.bars{position:relative;flex:1;min-width:0;height:128px;background:var(--tint);border-radius:16px;padding:32px 14px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:4px}
.bb{position:relative;flex:0 1 12px;min-width:6px;border:none;padding:0;border-radius:999px;background:var(--barc)}
.bb::before{content:"";position:absolute;inset:-8px -3px}
.bb.pr{background:transparent;border:1.5px dashed var(--mute)}
.bb.lock{opacity:.4}
.bb.sel{background:var(--orange);border:none;opacity:1}
.bb .tip{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-ink);font-size:11px;font-weight:500;line-height:1;padding:5px 9px;border-radius:999px;white-space:nowrap;pointer-events:none}
.bb .tip.l{left:-4px;transform:none}.bb .tip.r{left:auto;right:-4px;transform:none}
.sw{display:inline-block;width:7px;height:14px;border-radius:999px;background:var(--barc);margin:0 5px -2px 0}
.sw.pr{background:transparent;border:1.5px dashed var(--mute)}.sw.lock{opacity:.4}.sw.sel{background:var(--orange)}
.arrow{border:none;background:var(--tint);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;flex-shrink:0}
.locked{background:var(--tint);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details{border-bottom:1px solid var(--line);padding:6px 0}
details:last-child{border-bottom:none}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:13px;list-style:none}
summary::-webkit-details-marker{display:none}
details ul{margin:6px 0 2px;padding-left:18px;font-size:13px}
.audit{display:flex;flex-direction:column}
.aud{padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.aud:last-child{border-bottom:none}
.aud .t{color:var(--mute);font-size:11.5px;font-variant-numeric:tabular-nums}
.aud.fl{color:var(--alert-ink)}
.ai-head{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;padding:0;text-align:left}
.ai-ic{width:30px;height:30px;border-radius:50%;background:var(--pink);color:var(--on-pastel);display:grid;place-items:center;flex-shrink:0}
.ai-ic .ms{font-size:17px;vertical-align:0}
.aitag{background:var(--indigo);color:var(--on-indigo);border-radius:999px;padding:1px 8px;font-size:11px}
.msg{border-radius:14px;padding:8px 11px;font-size:13px;line-height:1.5;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.q{background:var(--indigo);color:var(--on-indigo);margin-left:22%;border-bottom-right-radius:4px}
.msg.a{background:var(--tint);margin-right:8%;border-bottom-left-radius:4px}
.cite{border:none;background:none;padding:0;color:var(--blue);text-decoration:underline;font-size:inherit}
input[type=text],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 11px;font-size:13px}
textarea{min-height:64px;resize:vertical}
.err{color:var(--alert);font-size:12.5px;min-height:0}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:9px 0;position:relative}
.step:not(:last-child)::after{content:"";position:absolute;left:14px;top:38px;bottom:-4px;width:2px;background:var(--line)}
.sc{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--tint);color:var(--mute);position:relative;z-index:1}
.step.done .sc{background:var(--green);color:var(--on-pastel)}
.step.open .sc{background:var(--indigo);color:var(--on-indigo)}
.step.over .sc,.step.rej .sc{background:var(--alert);color:#fff}
.step.cur{background:var(--tint);border-radius:14px;padding-inline:8px;margin-inline:-8px}
.step b{font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.metric{background:var(--yellow);color:var(--on-pastel);border-radius:14px;padding:10px 12px}
.metric:nth-child(4n+2){background:var(--pink)}.metric:nth-child(4n+3){background:var(--green)}.metric:nth-child(4n+4){background:var(--peri)}
.metric .mute{color:#3D3A33}
.metric b{display:block;font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:5px}
.bar.a i{background:var(--alert)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.tw{overflow-x:auto}
.switch{position:relative;width:46px;height:26px;border-radius:13px;border:none;background:var(--pill);flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--green)}
.switch.on::after{left:23px}
.overlay{position:fixed;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--card);color:var(--ink);border-radius:22px;max-width:460px;width:100%;padding:20px;max-height:88vh;overflow:auto}
.sheet h3{font-size:18px;margin-bottom:6px}
.scan{width:120px;height:120px;border-radius:50%;margin:14px auto;display:grid;place-items:center;background:var(--blue-bg);color:var(--blue);position:relative;overflow:hidden}
.scan .ms{font-size:72px;width:72px;height:72px;vertical-align:0}
.scan::after{content:"";position:absolute;left:10%;right:10%;height:3px;background:var(--alert);top:15%;animation:sweep 1.1s ease-in-out infinite alternate;border-radius:2px}
.scan.done::after,.scan.fail::after{display:none}
.scan.fail{background:var(--alert-bg);color:var(--alert)}

.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--indigo);color:var(--on-indigo);padding:10px 16px;border-radius:999px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.foot{color:var(--frame-mute);font-size:12px;text-align:center;padding-top:6px}
.xray{width:100%;border-radius:12px;background:#0b0d12;display:block}
.doc{background:var(--tint);border-radius:12px;padding:12px 14px;font-size:13px;white-space:pre-wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.brand h1{font-size:20px}}
</style>

const S={pid:0,role:"patient",view:"profile",sel:{},filter:"all",verified:{},aiOpen:false,ai:{},sample:undefined,seen:{}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic=n=>`<span class="ms" aria-hidden="true">${n}</span>`;
const cur=()=>P[S.pid];
const R=()=>ROLES[S.role];
function clock(){const d=new Date();return `14 Nov 2026 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
function whoLabel(p){return S.role==="patient"?p.name:(R().provider?`${R().provider} · ${R().staff}`:R().label)}
function log(p,what,flag){p.audit.unshift(A(clock(),whoLabel(p),what,flag))}
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- access rules ---------- */
function access(p,role){
  role=role||S.role;const r=ROLES[role];
  if(role==="patient")return {full:true,secs:new Set(SECTIONS.map(s=>s[0])),sens:true,label:"Everything"};
  if(!r.provider)return {none:true};
  const g=p.grants.find(g=>g.p===r.provider&&g.on);
  let full=false,secs=new Set();
  if(g){if(g.level==="full")full=true;else g.secs.forEach(s=>secs.add(s))}
  if(role==="pharmacy"){return {full,secs,own:"City Pharmacy",label:full?"Full access (granted)":"Medications, allergies and its own screening records"+(g&&g.secs.some(s=>!["allergies","medications"].includes(s))?" plus sections granted":"")}}
  if(role==="ambulance"){if(p.emergencyFull)return {full:true,secs:new Set(SECTIONS.map(s=>s[0])),flag:true,label:`Full record by ${p.first}'s emergency setting · flagged`};return {emOnly:true,flag:true,label:"Emergency card only · flagged"}}
  if(full)return {full:true,secs:new Set(SECTIONS.map(s=>s[0])),label:`Full access (${g.why.toLowerCase()}, on until ${p.first} turns it off)`};
  if(secs.size)return {secs,label:"Chosen sections: "+[...secs].map(s=>SECNAME[s]).join(", ")};
  return {emOnly:true,label:"No consent: emergency card only"};
}
function canSec(a,sec){return a.full||(a.secs&&a.secs.has(sec))}
function canEvent(a,e){if(a.emOnly||a.none)return false;if(canSec(a,CATSEC[e.cat]))return true;if(a.own&&e.place===a.own&&e.cat==="read")return true;return false}
function canFiles(a,e){return canEvent(a,e)&&(a.full||(a.secs&&a.secs.has("files"))||(a.own&&e.place===a.own))}
function canCase(a,p){return S.role==="patient"||S.role==="clinic"&&canSec(a,"readings")}
const secOfList={conditions:"conditions",medications:"medications",immun:"medications",implants:"surgeries",admissions:"conditions",pregnancy:"pregnancy",family:"conditions",social:"conditions"};
const listNames={conditions:"Conditions",medications:"Medications",immun:"Immunisations",implants:"Implants and devices",admissions:"Hospital admissions",pregnancy:"Pregnancy history",family:"Family history",social:"Social history"};
function needsGate(){return R().provider&&!S.verified[S.role+":"+cur().id]}

/* ---------- top bar ---------- */
function renderTop(){
  const showP=!["admin","regulator"].includes(S.role);
  $("patients").innerHTML=showP?`<span class="lbl">Patient</span>`+P.map((p,i)=>`<button class="chip${i===S.pid?" on":""}" data-pid="${i}">${esc(p.name)}</button>`).join(""):"";
  $("roles").innerHTML=`<span class="lbl">Viewing as</span>`+Object.entries(ROLES).map(([k,r])=>`<button class="chip sm${k===S.role?" on":""}" data-role="${k}">${esc(r.label)}${k==="ambulance"?" (emergency)":""}</button>`).join("");
  const T={patient:[["profile","person","Profile"],["case","route","Case"],["access","key","Access"],["audit","history","Audit log"]],clinic:[["profile","person","Profile"],["case","route","Case"]],pharmacy:[["profile","person","Profile"]],ambulance:[["profile","person","Profile"]],admin:[["dashboard","dashboard","Dashboard"]],regulator:[["trail","shield","Audit trail"]]}[S.role];
  if(!T.some(t=>t[0]===S.view))S.view=T[0][0];
  $("tabs").innerHTML=T.length>1?T.map(t=>`<button class="tab${t[0]===S.view?" on":""}" data-view="${t[0]}">${ic(t[1])}${t[2]}</button>`).join(""):"";
  const p=cur();let html="",flag=false;
  if(S.role==="patient")html=`${ic("person")}<span>Signed in as <b>${esc(p.name)}</b> with National ID and a one-time code (simulated). You see everything, can add files and decide who has access.</span>`;
  else if(S.role==="admin")html=`${ic("dashboard")}<span>Admin login. Aggregate numbers only: no names or records.</span>`;
  else if(S.role==="regulator")html=`${ic("shield")}<span>Regulator login. Audit trail only: who opened what, when and how. No medical content.</span>`;
  else{const v=S.verified[S.role+":"+p.id];
    if(!v)html=`${ic("lock")}<span><b>${esc(R().staff)}</b> · ${esc(R().provider)} · staff login with 2FA. The patient's identity isn't confirmed yet.</span>`;
    else{const a=access(p);flag=!!(a.flag||v.flag);html=`${ic(flag?"warning":"fingerprint")}<span><b>${esc(R().staff)}</b> · ${esc(R().provider)} · staff login with 2FA · patient identified by ${esc(v.method)} · <b>Access:</b> ${esc(a.label)}</span>`}}
  $("idbar").innerHTML=`<div class="idbar${flag?" flag":""}">${html}</div>`;
}

/* ---------- profile ---------- */
function gateHTML(){const p=cur(),amb=S.role==="ambulance";
  return `<div class="card" style="max-width:520px;margin:20px auto;text-align:center;padding:28px 22px">
   <div class="scan done" style="margin-top:0">${ic("fingerprint")}</div>
   <h2 style="justify-content:center;font-size:20px">${amb?"Emergency fingerprint search":"Confirm who the patient is"}</h2>
   <p class="mute" style="margin:6px auto 16px;max-width:42ch">${amb?"The patient can't give ID. A one-to-many search compares the fingerprint with all enrolled patients. It's flagged and reported.":`Ask the patient to place a finger on the facility's registered reader. A one-to-one check matches it to ${esc(p.first)}'s ID.`}</p>
   <button class="btn" data-act="scan">${ic("fingerprint")} Simulated scan</button>
   <p class="small mute" style="margin-top:12px">Demo: you're scanning ${esc(p.name)}. The scan is simulated; no reader is connected.</p></div>`}

function profileHTML(){
  const p=cur(),a=access(p);
  let top="";
  if(S.role==="ambulance")top=`<div class="banner">${ic("emergency")}<div style="flex:1"><b>Emergency access · flagged for review</b><div class="small">Logged and reported to ${esc(p.first)} and ${esc(p.contact)}. ${a.emOnly?"Full record is off in their settings.":"Full record opened by their own setting."}</div></div></div>`;
  return top+`<div class="grid"><div class="col">${summaryCard(p)}${aiCard(p,a)}${emCard(p)}${auditCard(p)}</div><div class="col">${rightCol(p,a)}</div></div>`}

function summaryCard(p){return `<section class="card"><div class="who"><div class="avatar">${ic("person")}</div><div><b>${esc(p.name)}</b><span class="small mute">${p.sex}, ${p.age} · ${p.clid}</span></div></div>${p.sum.map(r=>`<div class="kv"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join("")}</section>`}
function emCard(p){const e=p.em;const g=(t,arr)=>`<div class="grp">${t}</div><div class="tags">${arr.join("")}</div>`;
  const dnr=e.dnr?`<div role="note" aria-label="Resuscitation decision" style="background:var(--alert-bg);border:1.5px solid var(--alert);border-radius:12px;padding:10px 12px;margin:2px 0 10px">
    <div style="color:var(--alert-ink);font-weight:600">${ic("do_not_disturb_on")} ${esc(e.dnr.text)}</div>
    <div class="small" style="margin-top:4px"><b style="font-weight:500">CPR only.</b> ${esc(e.dnr.care)}</div>
    <div class="small mute" style="margin-top:4px">${esc(e.dnr.by)}</div></div>`:"";
  return `<section class="card"><h2>${ic("emergency")}Emergency card<span class="sub">Always available</span></h2>
  ${dnr}${g("Allergies",e.allergies.map(x=>`<span class="tag ${x[1]}">${esc(x[0])}</span>`))}${g("Conditions",e.conditions.map(x=>`<span class="tag">${esc(x)}</span>`))}${g("Medicines",e.meds.map(x=>`<span class="tag${/warfarin/i.test(x)?" sev":""}">${esc(x)}</span>`))}${g("Implants",e.implants.map(x=>`<span class="tag">${esc(x)}</span>`))}${g("Other",e.other.map(x=>`<span class="tag">${esc(x)}</span>`))}</section>`}
function auditCard(p){return `<section class="card"><h2>${ic("history")}Audit log<span class="sub">Live</span></h2><div class="audit">${p.audit.slice(0,5).map(audRow).join("")}</div>${S.role==="patient"?`<button class="btn ghost" style="margin-top:8px" data-view="audit">See all ${p.audit.length}</button>`:""}</section>`}
function audRow(x){return `<div class="aud${x.flag?" fl":""}"><div class="t">${esc(x.when)}${x.flag?" · flagged":""}</div><div><b style="font-weight:500">${esc(x.who)}</b>: ${esc(x.what)}</div></div>`}

function rightCol(p,a){
  let h="";
  if(a.emOnly){h+=`<section class="card"><h2>${ic("lock")}Emergency card only</h2><p class="mute" style="margin:0 0 10px">${S.role==="ambulance"?`${esc(p.first)} hasn't turned on "Full access in an emergency", so only the emergency card is shown.`:`${esc(R().provider)} has no consent for ${esc(p.first)}'s record.`}</p>${S.role!=="ambulance"?reqBtn(p,"full","Request access"):""}</section>`;return h}
  if(p.emergency&&(S.role==="patient"||a.full))h+=`<div class="banner">${ic("emergency")}<div style="flex:1"><b>Emergency access on ${esc(p.emergency.when.slice(0,11))}</b><div class="small">${esc(p.emergency.by)} found ${esc(p.first)} by fingerprint. Full record opened by her setting. Reported to ${esc(p.first)} and ${esc(p.contact)}.</div></div>${S.role==="patient"?`<button class="btn" data-view="audit">Review</button>`:""}</div>`;
  const c=p.caseData;
  if(c.status!=="closed"&&(canSec(a,"readings")||a.own)){const i=c.steps.findIndex(s=>!s.done),s=c.steps[i];
    h+=`<div class="banner">${ic("warning")}<div style="flex:1"><b>${c.status==="escalated"?"Escalated case":"Open case"}: ${esc(p.events.find(e=>e.caseLink).title.replace(" flagged",""))}</b><div class="small">Step ${i+1} of 8: ${STEP_NAMES[i]} · Owner ${esc(s.owner)} · Due ${esc(s.due)}</div></div>${canCase(a,p)?`<button class="btn" data-view="case">Open case</button>`:""}</div>`}
  h+=a.full?`<section class="card"><h2>${ic("route")}Care plan</h2>${p.plan.map(r=>`<div class="kv"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join("")}</section>`:`<section class="card"><h2>${ic("lock")}Care plan</h2><div class="locked"><span class="mute small" style="flex:1">Contact preferences, barriers and care team need full access.</span>${reqBtn(p,"full","Request access")}</div></section>`;
  h+=timelineCard(p,a)+detailCard(p,a)+sectionsCard(p,a)+sensitiveCard(p);
  return h}

function evList(p){const g=FGROUP[S.filter];return g?p.events.filter(e=>g.includes(e.cat)):p.events}
function selEvent(p){const L=evList(p);let id=S.sel[p.id];if(!L.some(e=>e.id===id))id=L.length?L[L.length-1].id:null;S.sel[p.id]=id;return L.find(e=>e.id===id)}
function timelineCard(p,a){const L=evList(p),e=selEvent(p),n=L.length;
  /* bar heights are visual rhythm only (stable per entry); locked entries stay short */
  const hgt=id=>{let h=2166136261;for(const c of String(id)+"~"){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return 34+(h>>>0)%66};
  const dots=L.map((x,i)=>{const ok=canEvent(a,x),sel=x.id===(e&&e.id);const tip=sel?`<span class="tip${n>4&&i<2?" l":n>4&&i>n-3?" r":""}">${esc(x.date)}</span>`:"";return `<button class="bb${sel?" sel":ok?(x.trust?"":" pr"):" lock"}" style="height:${sel?100:ok?hgt(x.id):30}%" data-ev="${x.id}" aria-label="${esc(ok?x.title+", "+x.date:"Locked entry, "+x.date)}" aria-pressed="${sel}" title="${esc(ok?x.title:"Locked")}">${tip}</button>`}).join("");
  return `<section class="card"><h2>${ic("history")}Timeline<span class="sub">${n} entr${n===1?"y":"ies"}</span></h2>
   <div class="row" style="margin-bottom:12px">${FILTERS.map(f=>`<button class="chip sm${S.filter===f[0]?" on":""}" data-filter="${f[0]}">${f[1]}</button>`).join("")}</div>
   ${n?`<div style="display:flex;align-items:center;gap:8px"><button class="arrow" data-step="-1" aria-label="Earlier entry">${ic("chevron_left")}</button><div class="bars">${dots}</div><button class="arrow" data-step="1" aria-label="Later entry">${ic("chevron_right")}</button></div>
   <div class="small mute" style="display:flex;justify-content:space-between;margin-top:4px"><span>${esc(L[0].date)}</span><span>${esc(L[n-1].date)}</span></div>
   <div class="small mute" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px"><span><span class="sw sel"></span>Selected</span><span><span class="sw"></span>Provider-verified</span><span><span class="sw pr"></span>Patient-reported</span><span><span class="sw lock"></span>Locked to you</span></div>`:`<p class="mute">No entries in this group.</p>`}</section>`}
function detailCard(p,a){const e=selEvent(p);if(!e)return "";
  if(!canEvent(a,e))return `<section class="card"><h2>${ic("lock")}Locked entry<span class="sub">${esc(e.date)}</span></h2><div class="locked"><span class="small" style="flex:1">This entry is in <b>${esc(SECNAME[CATSEC[e.cat]])}</b>, which ${esc(p.first)} hasn't shared with ${esc(R().provider)}.</span>${reqBtn(p,CATSEC[e.cat],"Request access")}</div></section>`;
  const files=(e.files||[]).concat(e.up||[]);const fOK=canFiles(a,e);
  const rel=(e.rel||[]).map(id=>p.events.find(x=>x.id===id)).filter(Boolean);
  return `<section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px"><div><h2 style="margin:0;font-size:18px">${esc(e.title)}</h2><div class="small mute">${esc(e.date)} · ${esc(e.place)}${e.by?" · "+esc(e.by):""}</div></div><span class="tag ${e.trust?"ok":"pr"}">${e.trust?"Provider-verified":"Patient-reported"}</span></div>
  ${e.rows.map(r=>`<div class="kv"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join("")}
  ${files.length||S.role==="patient"?`<div class="grp">Files</div>`:""}
  ${files.length?(fOK?`<div class="tags">${files.map((f,i)=>`<button class="tag file" data-file="${i}">${ic(f.t==="xray"||/^image/.test(f.mime||"")?"image":"description")} ${esc(f.n)} · Held at ${esc(f.held||e.place)}</button>`).join("")}</div>`:`<div class="locked"><span class="small" style="flex:1">${files.length} file${files.length>1?"s":""} held at ${esc(e.place)}. Imaging and files aren't shared with you.</span>${reqBtn(p,"files","Request access")}</div>`):""}
  ${S.role==="patient"?`<button class="btn ghost" style="margin-top:8px" data-act="upload">${ic("upload")} Add a file</button><div class="small mute" style="margin-top:4px">Your files are labelled patient-reported. In this demo they stay in your browser.</div>`:""}
  ${e.caseLink&&canCase(a,p)?`<button class="btn" style="margin-top:10px" data-view="case">${ic("route")} Open the case</button>`:""}
  ${rel.length?`<div class="grp">Related</div><div class="tags">${rel.map(x=>`<button class="tag" data-ev="${x.id}">${esc(x.title)} · ${esc(x.date)}</button>`).join("")}</div>`:""}</section>`}
function sectionsCard(p,a){return `<section class="card"><h2>${ic("description")}Record sections</h2>${Object.keys(listNames).map(k=>{const ok=canSec(a,secOfList[k]);return `<details${ok?"":" class=\"lk\""}><summary><span>${listNames[k]}</span><span class="mute small">${ok?p.secs[k].length+" item"+(p.secs[k].length>1?"s":""):ic("lock")+" Locked"}</span></summary>${ok?`<ul>${p.secs[k].map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<div class="locked" style="margin-top:6px"><span class="small" style="flex:1">Part of ${esc(SECNAME[secOfList[k]])}.</span>${reqBtn(p,secOfList[k],"Request access")}</div>`}</details>`}).join("")}</section>`}
function sensitiveCard(p){if(S.role!=="patient")return `<section class="card"><h2>${ic("lock")}Sensitive sections</h2><p class="small mute" style="margin:0">Mental health, HIV, hepatitis B and TB status, and sexual health are hidden by default. Only the patient can share them.</p></section>`;
  return `<section class="card"><h2>${ic("lock")}Sensitive sections<span class="sub">Hidden from everyone but you</span></h2><p class="small mute" style="margin:0 0 6px">Mental health · HIV, hepatitis B, TB · Sexual health. Never on the emergency card or sent to the assistant.</p>${p.sensitive.length?p.sensitive.map(s=>`<div class="kv"><span>${esc(s[0])}</span><span>${esc(s[1])}</span></div>`).join(""):`<p class="small" style="margin:0">None recorded.</p>`}</section>`}
function reqBtn(p,sec,label){if(S.role==="patient"||S.role==="ambulance")return "";const r=p.requests.find(r=>r.p===R().provider&&r.sec===sec&&r.status==="pending");return r?`<span class="tag">Requested ${esc(r.when.slice(12))}</span>`:`<button class="btn ghost" data-req="${sec}">${ic("key")} ${label}</button>`}

/* ---------- assistant ---------- */
const AIQ={patient:["What does my latest result mean?","When is my next check?","Who can see my record?","Summarise my record"],clinic:["Any reason to prioritise this referral?","Can they have amoxicillin?","Summarise this case"],pharmacy:["Any allergies I should know about?","What medicines are they on?"],ambulance:["What matters most right now?","Any blood thinners or implants?"]};
function aiCard(p,a){const st=S.ai[S.role+":"+p.id]||(S.ai[S.role+":"+p.id]={msgs:[],busy:false,err:""});
  const offline=S.sample===null;
  let body="";
  if(S.aiOpen){
    body=`<div class="small mute" style="margin-top:8px">${offline?"AI isn't available here; it runs on the claude.ai version for signed-in viewers. Answers below come from an offline keyword search of the record.":"Sees only what you can see"+(a.emOnly?" (emergency card)":"")+". Sensitive sections are never sent."}</div>`+
      st.msgs.map(m=>`<div class="msg ${m.r}">${m.r==="a"?citeHTML(m.t):esc(m.t)}${m.off?`<div class="small mute" style="margin-top:4px">${m.note?esc(m.note)+" · ":""}Offline record search · not AI</div>`:""}</div>`).join("")+
      `<div class="tags" style="margin-top:8px">${(AIQ[S.role]||[]).map((q,i)=>`<button class="chip sm" data-aiq="${i}"${st.busy?" disabled":""}>${esc(q)}</button>`).join("")}${st.msgs.length?`<button class="chip sm" data-act="aiclear" style="background:transparent;box-shadow:inset 0 0 0 1px var(--line)">Clear chat</button>`:""}</div>
      <form id="aiForm" style="display:flex;gap:6px;margin-top:8px"><input type="text" id="aiIn" maxlength="300" autocomplete="off" placeholder="${S.role==="patient"?"When is my next check?":"Ask about this record"}" aria-label="Question for the record assistant"><button class="btn" aria-label="Send"${st.busy?" disabled":""}>${ic("send")}</button></form><div class="err" id="aiErr" role="status">${esc(st.err)}</div>`+
      `<div class="small mute" style="margin-top:6px">Answers from the record only, with sources. No diagnosis or treatment advice. Flags, escalation and closure stay rule-based and human.</div>`}
  return `<section class="card" style="padding:12px 16px"><button class="ai-head" data-act="aitoggle" aria-expanded="${S.aiOpen}"><span class="ai-ic">${ic("auto_awesome")}</span><b style="font-weight:600;flex:1">Ask the record</b><span class="aitag">${offline?"Offline":"AI"}</span>${ic(S.aiOpen?"close":"chevron_right")}</button>${body}</section>`}
function citeHTML(t){const p=cur();return esc(t).replace(/\[([a-z]\d{1,2}(?:\s*,\s*[a-z]\d{1,2})*)\]/gi,(m,ids)=>ids.split(/\s*,\s*/).map(id=>{const e=p.events.find(x=>x.id===id.toLowerCase());return e?`<button class="cite" data-ev="${e.id}">${esc(e.title)}</button>`:""}).join(", "))}
function aiContext(p,a){const L=[];
  L.push(`Patient: ${p.name}, ${p.sex}, ${p.age}, CareLoop ID ${p.clid}. Preferred language: ${p.lang}.`);
  L.push("Emergency card: allergies "+p.em.allergies.map(x=>x[0]).join("; ")+". Conditions "+p.em.conditions.join("; ")+". Medicines "+p.em.meds.join("; ")+". Implants "+p.em.implants.join("; ")+". Other "+p.em.other.join("; ")+"."+(p.em.dnr?` Resuscitation: ${p.em.dnr.text}. ${p.em.dnr.care} ${p.em.dnr.by}.`:" Resuscitation: no DNR recorded."));
  if(!a.emOnly){L.push("Summary: "+p.sum.map(r=>r[0]+" "+r[1]).join("; ")+".");
    Object.keys(listNames).forEach(k=>{if(canSec(a,secOfList[k]))L.push(listNames[k]+": "+p.secs[k].join("; ")+".")});
    if(a.full)L.push("Care plan: "+p.plan.map(r=>r[0]+": "+r[1]).join("; ")+".");
    p.events.forEach(e=>{if(canEvent(a,e))L.push(`[${e.id}] ${e.date} · ${e.title} · ${e.place} · ${e.trust?"provider-verified":"patient-reported"} · `+e.rows.map(r=>r[0]+": "+r[1]).join("; "))});
    if(canSec(a,"readings")||a.own){const c=p.caseData,i=c.steps.findIndex(s=>!s.done);L.push(`Case (${c.title}): status ${c.status}; opened ${c.opened}; `+(i<0?"all steps done":`current step ${STEP_NAMES[i]}, owner ${c.steps[i].owner}, due ${c.steps[i].due}`)+"; log: "+c.log.map(x=>x[0]+" "+x[1]).join(" | "))}}
  const locked=SECTIONS.filter(s=>!canSec(a,s[0])).map(s=>s[1]);
  if(locked.length)L.push("Locked to this viewer (not provided, never guess): "+locked.join(", ")+".");
  return L.join("\n")}
/* Questions asking for a diagnosis, treatment choice or dose get a fixed reply in both modes, before anything reaches the model */
const GUARD=/\b(what|which|right|correct) dose\b|\bhow (much|many) (\w+ ){0,3}(should|can|must)\b|\bhow (much|many) do\b|\bshould (i|he|she|they|we) (take|stop|start|increase|reduce|double|skip)\b|(?<!\b(what|which|how many) (allerg\w*|medicines?|medications?|vaccines?|vaccinations?|immunisations?|implants?|conditions?|files?|records?|appointments?|visits?|referrals?|readings?|tests?|checks?) )\bdo i have\b(?! (any |my |an? )?(allerg|appointment|medic|medicine|vaccin|immuni|implant|file|record|access|condition|visit|referral|next|upcoming|check|test result|reading|emergency|contact|plan))|(?<!\b(what|which|how many) (allerg\w*|medicines?|medications?|vaccines?|vaccinations?|immunisations?|implants?|conditions?|files?|records?|appointments?|visits?|referrals?|readings?|tests?|checks?) )\bhave i got\b(?! (any |my |an? )?(allerg|appointment|medic|medicine|vaccin|immuni|implant|file|record|access|condition|visit|referral|next|upcoming|check|test result|reading|emergency|contact|plan))|\bam i (sick|ill|dying|ok)\b|\bdiagnos(e|is) (me|him|her|them)\b|\bprescribe\b|\bwhat treatment\b|\bcure\b/i;
/* Resuscitation questions get the recorded decision (stating a record isn't advice); "am I dying" questions get a gentle pointer to the care team */
const RESUS_Q=/\b(cpr|resus\w*|dnr|dnacpr)\b/i, DYING_Q=/\bam i (dying|going to die)\b|\bhow long (do|have) i (have|got)\b/i;
const GUARD_REPLY="I can't diagnose or advise on treatment or doses; the clinician decides. I can tell you what the record says, for example medicines, allergies or the next step in the case.";
const STOPW=new Set("what when where which does have with this that their there about record from they them your mine will would could should please tell show give been were into".split(" "));
function localAnswer(q,p,a){
  if(DYING_Q.test(q)){const team=(p.plan.find(r=>r[0]==="Care team")||["",""])[1].split("·").map(s=>s.trim()).filter(Boolean).slice(0,2).map(s=>/^(Dr|Nurse)\b/.test(s)?s:"the "+s).join(" or ");
    return `That's an important question, and it deserves a real conversation, not a record search. ${team||"Your care team"} can talk it through with you. I can only tell you what the record says.`}
  if(GUARD.test(q)&&!RESUS_Q.test(q))return GUARD_REPLY;
  const pt=S.role==="patient",poss=pt?"Your":p.first+"'s",lq=q.toLowerCase(),vis=!a.emOnly&&!a.none,has=re=>re.test(lq);
  const evs=p.events.filter(e=>canEvent(a,e));
  const cite=f=>{const ids=evs.filter(f).map(e=>e.id);return ids.length?" ["+ids.join(", ")+"]":""};
  const caseOK=pt||(vis&&canSec(a,"readings"));
  const allergies=()=>poss+" allergies: "+p.em.allergies.map(x=>x[0]).join("; ")+"."+cite(e=>e.cat==="allergy");
  const meds=()=>poss+" medicines: "+(vis&&canSec(a,"medications")?p.secs.medications:p.em.meds).join("; ")+"."+cite(e=>e.cat==="med");

    delete S.draft[p.id];toast(m.when?`Queued: sends ${m.when}`:"Message sent");return render()}}

/* ---------- dashboard (simulated cohort) ---------- */
function rng(seed){return ()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
const COHORT=(()=>{const r=rng(11),fac=["City Pharmacy","Family Health Clinic","Central General Hospital"],reasons=["Work hours","Cost of visit","Transport","Couldn't reach patient","Felt well, didn't return","Moved away"],w=[5,3,3,2,1,1];
  const sts=[...Array(34).fill("closed"),...Array(13).fill("open"),...Array(5).fill("overdue"),...Array(4).fill("lost"),...Array(2).fill("rejected"),"unassigned","escalated"];
  return sts.map((s,i)=>{const f=[5,25,45].includes(i)?"Community outreach":fac[Math.floor(r()*3)];const sex=r()<.52?"F":"M",age=["18 to 39","40 to 59","60 and over"][Math.floor(r()*3)];
   const prog=s==="closed"?8:s==="open"?2+Math.floor(r()*4):s==="overdue"||s==="escalated"?4:s==="lost"?3+Math.floor(r()*2):3;
   const nh=r()<.1?20+Math.floor(r()*20):Math.floor(r()*5),cd=prog>=5?3+Math.floor(r()*10):null,care=prog>=6?cd+Math.floor(r()*7):null;
   let reason=null;if(["overdue","lost","rejected","escalated"].includes(s)){if(s==="escalated")reason="Work hours";else{let x=r()*15;for(let k=0;k<6;k++){x-=w[k];if(x<0){reason=reasons[k];break}}reason=reason||reasons[0]}}
   const owner=s==="unassigned"?"Unassigned":f==="Central General Hospital"?"Dr N. Haddad":f==="City Pharmacy"?"Pharm. J. Osei":"Nurse A. Bello";
   const late=s==="overdue"?3+Math.floor(r()*18):s==="lost"?21+Math.floor(r()*20):s==="escalated"?36:s==="rejected"||s==="unassigned"?1+Math.floor(r()*4):0;
   return {id:"C-"+(1040+i),s,f,sex,age,prog,nh,cd,care,reason,owner,late}})})();
const PROGRAMMES=[
 {n:"Hypertension",live:true,trig:"BP 140/90 or above (180/120 or above escalates the same day)",next:"Confirmatory reading, then seen by a clinician"},
 {n:"Diabetes",trig:"Raised blood glucose at screening",next:"Confirmatory test (fasting glucose or HbA1c), then clinician review"},
 {n:"Cervical cancer",trig:"Positive HPV or VIA screen",next:"Treatment or further assessment visit"},
 {n:"Tuberculosis",trig:"Positive symptom screen, e.g. cough for 2 weeks or more",next:"Sputum test, then treatment start if positive"},
 {n:"Newborn sickle cell",trig:"Positive newborn screen",next:"Confirmatory test, then enrolment in a sickle cell clinic"}];
function progHTML(){return `<section class="card"><h2>${ic("route")}Screening programmes<span class="sub">Same 8-step case engine</span></h2><p class="small mute" style="margin:0 0 8px">Each programme needs only its own trigger rule and owners. Only hypertension has demo data; the others are example rules, to be set with clinical partners.</p><div class="progs">${PROGRAMMES.map(g=>`<div class="prog"><div class="ph"><b>${g.n}</b><span class="tag${g.live?" ok":""}">${g.live?"In this demo":"Example rule"}</span></div><div class="pr"><span class="mute">Opens a case</span><span>${esc(g.trig)}</span></div><div class="pr"><span class="mute">Next step</span><span>${esc(g.next)}</span></div></div>`).join("")}</div></section>`}
function median(a){a=a.filter(x=>x!=null).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2}
function dashHTML(){const C=COHORT,n=C.length,closed=C.filter(c=>c.s==="closed").length,prob=C.filter(c=>["overdue","lost","rejected","unassigned","escalated"].includes(c.s));
  const tile=(l,v,s)=>`<div class="metric"><span class="small mute">${l}</span><b>${v}</b>${s?`<span class="small mute">${s}</span>`:""}</div>`;
  const funnel=STEP_NAMES.map((nm,k)=>{const v=C.filter(c=>c.prog>=k+1).length;return `<div style="display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 36px;gap:8px;align-items:center;font-size:13px;margin:5px 0"><span>${nm}</span><div class="bar"><i style="width:${(v/n*100).toFixed(1)}%"></i></div><span style="text-align:right;font-variant-numeric:tabular-nums">${v}</span></div>`}).join("");
  const rc={};prob.forEach(c=>{if(c.reason)rc[c.reason]=(rc[c.reason]||0)+1});const rmax=Math.max(...Object.values(rc));
  const reasons=Object.entries(rc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:13px;margin:5px 0"><span>${esc(k)}</span><div class="bar a"><i style="width:${(v/rmax*100).toFixed(1)}%"></i></div><span style="text-align:right">${v}</span></div>`).join("");
  const grp=(key,label)=>{const G={};C.forEach(c=>(G[c[key]]=G[c[key]]||[]).push(c));return `<table><thead><tr><th>${label}</th><th>Cases</th><th>Closed</th><th>Median days to care</th></tr></thead><tbody>${Object.entries(G).map(([k,a])=>a.length<5?`<tr><td>${esc(k)}</td><td colspan="3" class="mute">Fewer than 5 cases, hidden to protect privacy</td></tr>`:`<tr><td>${esc(k)}</td><td>${a.length}</td><td>${Math.round(a.filter(c=>c.s==="closed").length/a.length*100)}%</td><td>${median(a.map(c=>c.care))??"–"}</td></tr>`).join("")}</tbody></table>`};
  const label={overdue:"Overdue",lost:"Lost to follow-up",rejected:"Referral rejected",unassigned:"Unassigned",escalated:"Escalated, rebooked 18 Nov"};
  return `<div style="display:flex;flex-direction:column;gap:14px">
  <div style="color:var(--frame-ink)"><h2 style="font-size:22px">Closing the loop: last 12 months</h2><p style="margin:2px 0 0;color:var(--frame-mute);font-size:13px">Simulated cohort of ${n} raised-BP cases across 4 sites. Aggregate only; no names.</p></div>
  <div class="metrics">${tile("Cases flagged",n)}${tile("Closed with evidence",Math.round(closed/n*100)+"%",closed+" of "+n)}${tile("Median time to notification",median(C.map(c=>c.nh))+" h")}${tile("Median time to confirmation",median(C.map(c=>c.cd))+" days")}${tile("Median time to care",median(C.map(c=>c.care))+" days")}${tile("Overdue, rejected or unassigned",prob.length,"need an owner's action")}</div>
  ${progHTML()}
  <div class="grid2"><section class="card"><h2>${ic("route")}Where cases drop off</h2><p class="small mute" style="margin:0 0 6px">Cases that reached each step.</p>${funnel}</section>
  <section class="card"><h2>${ic("warning")}Why people dropped off</h2><p class="small mute" style="margin:0 0 6px">Reasons recorded on overdue, lost, rejected and escalated cases.</p>${reasons}</section></div>
  <section class="card"><h2>${ic("warning")}Needs action<span class="sub">Sorted by days late</span></h2><div class="tw"><table><thead><tr><th>Case</th><th>Status</th><th>Site</th><th>Owner</th><th>Days late</th><th>Reason</th></tr></thead><tbody>${prob.sort((a,b)=>b.late-a.late).map(c=>`<tr><td>${c.id}</td><td><span class="tag ${c.s==="escalated"?"mod":"sev"}">${label[c.s]}</span></td><td>${esc(c.f)}</td><td${c.owner==="Unassigned"?' style="color:var(--alert)"':""}>${esc(c.owner)}</td><td>${c.late}</td><td>${esc(c.reason||"–")}</td></tr>`).join("")}</tbody></table></div></section>
  <div class="grid2"><section class="card"><h2>By site</h2><div class="tw">${grp("f","Site")}</div></section><section class="card"><h2>By age group</h2><div class="tw">${grp("age","Age")}</div></section></div></div>`}

function scanFlow(){const p=cur(),amb=S.role==="ambulance";

function fallback(kind){const p=cur();const m=$("scanMore");
  if(kind==="otp")m.innerHTML=`<label class="small" for="fbIn" style="display:block;margin-top:12px">Code the patient reads out (demo code: 4829)</label><input type="text" id="fbIn" inputmode="numeric" maxlength="4"><div class="err" id="fbErr"></div><button class="btn" style="margin-top:8px" data-fbgo="otp">Confirm</button>`;
  if(kind==="pin")m.innerHTML=`<label class="small" style="display:flex;gap:6px;margin-top:12px"><input type="checkbox" id="fbId"> I checked the photo on ${esc(p.first)}'s National ID card</label><label class="small" for="fbIn" style="display:block;margin-top:8px">Patient's PIN (demo PIN: 2580)</label><input type="password" id="fbIn" inputmode="numeric" maxlength="4"><div class="err" id="fbErr"></div><button class="btn" style="margin-top:8px" data-fbgo="pin">Confirm</button>`;

  const i=$("fbIn");if(i){i.focus();i.addEventListener("input",()=>$("fbErr").textContent="")}}
function fallbackGo(kind){const v=$("fbIn").value.trim(),e=m=>$("fbErr").textContent=m;
  if(kind==="otp"){if(v!=="4829")return e("That code doesn't match. Check the patient's phone and try again.");verify("one-time code to the patient's phone (fingerprint failed)",false)}
  if(kind==="pin"){if(!$("fbId").checked)return e("Check the ID card photo first.");if(v!=="2580")return e("That PIN doesn't match. Ask the patient to type it again.");verify("National ID card and PIN (fingerprint failed)",false)}
  if(kind==="staff"){if(v.length<8)return e("Give a short reason. It goes in the audit log.");verify("staff-assisted entry (flagged): "+v,true)}}
function verify(method,flag){const p=cur(),amb=S.role==="ambulance";S.verified[S.role+":"+p.id]={method,flag};
  if(amb){log(p,`Emergency fingerprint search (one-to-many): matched`,true);log(p,p.emergencyFull?"Full record opened by patient's emergency setting":"Emergency card opened",true);p.audit.unshift(A(clock(),"CareLoop",`${p.first} and ${p.contact} notified of emergency access`))}
  else log(p,`Opened record · identified by ${method}`,flag);
  closeModal();render()}
function fileModal(f){const p=cur(),e=selEvent(p);log(p,`Opened file: ${f.n}`);
  let body=f.t==="xray"?xraySVG(f.x):f.t==="doc"?`<div class="doc">${esc(f.d)}</div>`:/^image/.test(f.mime||"")?`<img src="${f.url}" alt="${esc(f.n)}" style="border-radius:12px">`:`<div class="doc">${esc(f.n)} · ${Math.max(1,Math.round(f.size/1024))} KB\nStored in this browser only for the demo.</div>`;
  openModal(`<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><h3>${esc(f.n)}</h3><p class="small mute" style="margin:0 0 10px">${esc(e.title)} · ${esc(e.date)} · held at ${esc(f.held||e.place)}${f.t==="xray"?" · simulated image":""}</p></div><button class="arrow" data-act="close" aria-label="Close">${ic("close")}</button></div>${body}<p class="small mute" style="margin:10px 0 0">CareLoop keeps an index; the file stays at the facility that made it. Opening it was logged.</p>`);render()}
function xraySVG(k){const pre=k===XRAY_PRE;return `<svg class="xray" viewBox="0 0 300 200" role="img" aria-label="Simulated forearm X-ray"><rect width="300" height="200" fill="#0b0d12"/><path d="M20 70 Q150 55 280 62 L280 92 Q150 86 20 98Z" fill="#cfd6df" opacity=".85"/><path d="M20 112 Q150 108 280 104 L280 128 Q150 136 20 140Z" fill="#b9c2cc" opacity=".8"/>${pre?`<path d="M150 58 L144 96" stroke="#0b0d12" stroke-width="4"/>`:`<path d="M150 58 L146 94" stroke="#7d8794" stroke-width="2" opacity=".5"/>`}${pre?"":`<rect x="100" y="64" width="100" height="10" rx="3" fill="#f5f7fa"/>${[112,128,144,160,176,190].map(x=>`<rect x="${x-2}" y="58" width="4" height="34" fill="#f5f7fa"/>`).join("")}`}<text x="10" y="190" fill="#8b95a3" font-size="10" font-family="Inter,sans-serif">L · ${pre?"Nov 2019 · fracture":"Feb 2020 · healed, plate in place"} · SIMULATED</text></svg>`}

/* ---------- render + events ---------- */
function renderMain(){const v=S.view;let h="";
  if(v==="profile")h=needsGate()?gateHTML():profileHTML();else if(v==="case")h=needsGate()?gateHTML():caseHTML();else if(v==="access")h=accessHTML();else if(v==="audit")h=auditHTML();else if(v==="dashboard")h=dashHTML();else if(v==="trail")h=trailHTML();
  const ae=document.activeElement,keep=ae&&ae.id;const val=keep&&ae.value;
  $("main").innerHTML=h;
  if(keep&&$(keep)){$(keep).value=val;if(keep!=="aiIn"||!S.ai[S.role+":"+cur().id].busy)$(keep).focus()}}
function render(){
  if(S.role==="patient"&&!S.seen[cur().id]){S.seen[cur().id]=1;log(cur(),"You viewed your record")}
  renderTop();renderMain()}

document.addEventListener("click",ev=>{const t=ev.target.closest("button,[data-act]");if(!t)return;const d=t.dataset,p=cur();
  if(d.pid!=null){S.pid=+d.pid;return render()}
  if(d.role){S.role=d.role;S.view={admin:"dashboard",regulator:"trail"}[d.role]||"profile";return render()}
  if(d.view){S.view=d.view;window.scrollTo({top:0});return render()}

  if(d.ev){S.filter=FGROUP[S.filter]&&!FGROUP[S.filter].includes(p.events.find(e=>e.id===d.ev).cat)?"all":S.filter;S.sel[p.id]=d.ev;if(S.view!=="profile")S.view="profile";render();const tl=document.querySelector(".bars");if(tl&&t.classList.contains("cite"))tl.scrollIntoView({behavior:"smooth",block:"center"});return}
  if(d.step){const L=evList(p),e=selEvent(p);const i=L.indexOf(e)+(+d.step);if(i>=0&&i<L.length){S.sel[p.id]=L[i].id;renderMain()}return}
  if(d.file!=null){const e=selEvent(p);return fileModal((e.files||[]).concat(e.up||[])[+d.file])}
  if(d.req){p.requests.push({p:R().provider,sec:d.req,when:clock(),status:"pending"});log(p,`Requested access: ${d.req==="full"?"full record":SECNAME[d.req]}`);toast(`Request sent to ${p.first}`);return render()}
  if(d.aiq!=null){return askAI(AIQ[S.role][+d.aiq])}

  if(d.fbgo)return fallbackGo(d.fbgo);
  if(d.approve!=null){const r=p.requests[+d.approve];return pinModal("Approve request",`Give <b>${esc(r.p)}</b> ${r.sec==="full"?"full access":"access to "+esc(SECNAME[r.sec])}? It stays on until you turn it off.`,()=>{r.status="approved";let g=p.grants.find(g=>g.p===r.p);if(!g){g={p:r.p,level:"sections",secs:[],on:true,since:"14 Nov 2026",why:"Approved request"};p.grants.push(g)}g.on=true;if(r.sec==="full")g.level="full";else if(!g.secs.includes(r.sec))g.secs.push(r.sec);log(p,`Approved request from ${r.p}`);toast(`${r.p} notified`);render()})}
  if(d.decline!=null){const r=p.requests[+d.decline];r.status="declined";log(p,`Declined request from ${r.p}`);toast(`${r.p} notified`);return render()}
  if(d.revoke!=null){const g=p.grants[+d.revoke];return pinModal("Remove access",`<b>${esc(g.p)}</b> will lose access now and be told.`,()=>{g.on=false;Object.keys(S.verified).forEach(k=>{});log(p,`Removed access for ${g.p}`);toast(`${g.p} notified`);render()})}
  switch(d.act){
   case "scan":return scanFlow();
   case "close":return closeModal();
   case "aitoggle":S.aiOpen=!S.aiOpen;return renderMain();
   case "aiclear":S.ai[S.role+":"+p.id]={msgs:[],busy:false,err:""};return renderMain();
   case "upload":return $("fileIn").click();
   case "emtoggle":return pinModal(p.emergencyFull?"Turn off full emergency access":"Turn on full emergency access",p.emergencyFull?"Ambulances and hospitals will see your emergency card only in an emergency.":"Ambulances and hospitals will see your whole record in an emergency. It's always flagged and reported to you.",()=>{p.emergencyFull=!p.emergencyFull;log(p,`Full access in an emergency turned ${p.emergencyFull?"on":"off"}`);toast(`Turned ${p.emergencyFull?"on":"off"}`);render()});
   case "stepdone":case "reject":case "escalate":case "reassign":return caseAct(d.act);
   case "draft":case "draftsend":case "draftdiscard":return draftAct(d.act);
  }});
document.addEventListener("submit",ev=>{ev.preventDefault();const f=ev.target,p=cur();
  if(f.id==="aiForm"){const v=$("aiIn").value.trim();if(!v){$("aiErr").textContent="Type a question first.";return}$("aiIn").value="";askAI(v)}
  if(f.id==="noteForm"){const v=$("noteIn").value.trim();if(!v){$("noteErr").textContent="Write the note first.";return}p.caseData.notes.push([clock(),R().staff,v]);log(p,"Added a clinician note");$("noteIn").value="";render()}
  if(f.id==="grantForm"){const prov=$("gProv").value,lvl=f.querySelector("input[name=gLevel]:checked").value,secs=[...f.querySelectorAll("#gSecs input:checked")].map(x=>x.value),pin=$("gPin").value,e=m=>$("gErr").textContent=m;
    if(!prov)return e("Choose a provider.");if(lvl==="sections"&&!secs.length)return e("Tick at least one section.");if(!/^\d{4}$/.test(pin))return e("Enter your 4-digit PIN.");
    let g=p.grants.find(g=>g.p===prov);if(!g){g={p:prov,why:"Chosen by "+p.first,since:"14 Nov 2026"};p.grants.push(g)}Object.assign(g,{level:lvl,secs:lvl==="full"?[]:secs,on:true});
    log(p,`Gave ${prov} ${lvl==="full"?"full access":"access to "+secs.map(s=>SECNAME[s]).join(", ")}`);toast(`${prov} notified`);render()}});
document.addEventListener("input",ev=>{const id=ev.target.id;if(id==="aiIn"&&$("aiErr"))$("aiErr").textContent="";if(id==="caseEv"&&$("caseErr"))$("caseErr").textContent="";if(id==="noteIn")$("noteErr").textContent="";if(id==="draftIn"){const d=S.draft[cur().id];if(d&&!d.busy)d.text=ev.target.value;if($("draftErr"))$("draftErr").textContent=""}if(["gProv","gPin"].includes(id))$("gErr").textContent=""});
document.addEventListener("change",ev=>{if(["gProv"].includes(ev.target.id))$("gErr").textContent=""});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!$("modal").hidden)closeModal()});
$("modal").addEventListener("click",ev=>{if(ev.target===$("modal"))closeModal()});
$("fileIn").addEventListener("change",ev=>{const f=ev.target.files[0];if(!f)return;const p=cur(),e=selEvent(p);(e.up=e.up||[]).push({n:f.name,t:"upload",mime:f.type,size:f.size,url:URL.createObjectURL(f),held:"Patient upload"});log(p,`Uploaded file: ${f.name} (patient-reported)`);ev.target.value="";toast("File added, labelled patient-reported");render()});

render();
S.sampleP=(async()=>{try{S.sample=window.claude&&window.claude.use?await window.claude.use("sample"):null}catch(e){S.sample=null}if(S.aiOpen)renderMain()})();
</script>
</body>
</html>
